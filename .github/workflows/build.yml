name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Universal macOS app
        run: ./scripts/build-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChoongumaGrowHelper-macOS-universal
          path: |
            dist/ChoongumaGrowHelper-macOS-universal.zip
            dist/ChoongumaGrowHelper-macOS-universal.zip.sha256
